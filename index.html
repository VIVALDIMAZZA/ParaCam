<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spirit Net - Web LiDAR</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-green: #00ff88;
            --dark-bg: #030508;
            --red-stop: #ff3333;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--dark-bg); color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; user-select: none;
        }

        /* Video disembunyikan, hanya digunakan sebagai sumber data */
        #camera-feed { display: none; }
        
        /* Canvas Utama untuk merender Point Cloud */
        #lidar-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background: #000;
        }

        /* UI Overlay - Top Bar */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%; padding: 40px 20px 15px; 
            box-sizing: border-box; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
        }
        .header-title { display: flex; flex-direction: column; }
        .title { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
        .subtitle { font-size: 12px; color: var(--neon-blue); font-weight: 500; }
        
        .top-controls { display: flex; gap: 10px; align-items: center; }
        .icon-btn { 
            width: 35px; height: 35px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
            font-size: 16px; font-weight: bold;
        }

        /* UI Overlay - Point Cloud Counter */
        .point-cloud-stats {
            position: absolute; top: 100px; left: 20px; right: 20px; z-index: 10;
            display: flex; justify-content: space-between; font-size: 10px; font-weight: 700;
            color: rgba(255,255,255,0.6); letter-spacing: 1px;
        }
        .point-count { color: white; font-size: 12px; font-variant-numeric: tabular-nums; }

        /* UI Overlay - Bottom Bar */
        .bottom-bar {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 10;
            display: flex; gap: 15px;
        }
        .action-btn {
            flex: 1; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(20, 25, 30, 0.8); backdrop-filter: blur(10px);
            color: white; font-size: 14px; font-weight: 600; text-align: center;
            display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer;
        }
        .btn-stop { border-color: rgba(255, 51, 51, 0.3); }
        .stop-icon { width: 12px; height: 12px; background: var(--red-stop); }
        .btn-record { border-color: rgba(0, 255, 136, 0.3); }
        .record-icon { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--neon-green); background: transparent; }
        .recording .record-icon { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }

        /* Layar Inisialisasi */
        #startup {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background: var(--dark-bg); display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .start-btn {
            background: transparent; border: 2px solid var(--neon-blue); color: var(--neon-blue);
            padding: 15px 30px; font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Layar Awal -->
    <div id="startup">
        <h2 style="color: var(--neon-blue); margin-bottom: 5px;">SPIRIT NET</h2>
        <p style="font-size: 12px; color: #888; margin-bottom: 30px;">Web-Based LiDAR Simulation</p>
        <button class="start-btn" onclick="initScanner()">INITIALIZE SCANNER</button>
    </div>

    <!-- UI Overlay ala Spirit Net -->
    <div class="top-bar">
        <div class="icon-btn">≡</div>
        <div class="header-title">
            <span class="title">Spirit Net</span>
            <span class="subtitle">LiDAR Scanner</span>
        </div>
        <div class="top-controls">
            <div class="icon-btn" style="color: var(--neon-green);">●</div>
            <div class="icon-btn" style="font-size: 10px;">REC</div>
            <div class="icon-btn">⚙</div>
        </div>
    </div>

    <div class="point-cloud-stats">
        <span>⚬ POINT CLOUD</span>
        <span class="point-count" id="counter">0</span>
    </div>

    <div class="bottom-bar">
        <div class="action-btn btn-stop">
            <div class="stop-icon"></div> STOP
        </div>
        <div class="action-btn btn-record" id="rec-btn">
            <div class="record-icon"></div> RECORD
        </div>
    </div>

    <!-- Video Source & Processing Canvas -->
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="lidar-canvas"></canvas>

    <script>
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('lidar-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const counter = document.getElementById('counter');
        
        let scanning = false;
        let animationId;
        let basePoints = 750000;

        // Offscreen canvas untuk membaca frame video secara efisien
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        // Memulai Kamera dan Sensor
        async function initScanner() {
            document.getElementById('startup').style.display = 'none';
            
            // Minta izin GPS (Sesuai kebutuhan sistem background)
            navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}, {enableHighAccuracy: true});

            try {
                // Aktifkan kamera belakang
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    resizeCanvas();
                    scanning = true;
                    processLiDAREffect();
                };
            } catch (err) {
                alert("Gagal mengakses kamera: " + err.message);
            }
        }

        function resizeCanvas() {
            // Sesuaikan ukuran resolusi layar perangkat
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Set ukuran offscreen canvas lebih kecil untuk performa pemrosesan piksel
            // Semakin kecil resolusinya, semakin cepat, namun titik terlihat lebih besar
            offCanvas.width = window.innerWidth / 3; 
            offCanvas.height = window.innerHeight / 3;
        }

        window.addEventListener('resize', resizeCanvas);

        // Algoritma Utama: Mengubah Kamera Asli menjadi Point Cloud
        function processLiDAREffect() {
            if (!scanning) return;

            const w = offCanvas.width;
            const h = offCanvas.height;
            const scaleX = canvas.width / w;
            const scaleY = canvas.height / h;

            // Gambar frame kamera ke canvas tersembunyi
            offCtx.drawImage(video, 0, 0, w, h);
            
            // Ambil data piksel
            const imgData = offCtx.getImageData(0, 0, w, h);
            const data = imgData.data;

            // Bersihkan kanvas utama (Latar Hitam)
            ctx.fillStyle = 'rgba(2, 4, 10, 0.9)'; // Sedikit transparan agar ada efek 'ghosting'
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let dotsRendered = 0;

            // Loop melalui piksel (Lompat setiap 2 piksel untuk membuat jarak/titik)
            const step = 2; 
            
            for (let y = 0; y < h; y += step) {
                for (let x = 0; x < w; x += step) {
                    const i = (y * w + x) * 4;
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    // Hitung tingkat kecerahan piksel
                    const brightness = (r + g + b) / 3;

                    // Logika LiDAR palsu: Hanya render area yang memiliki kontras/cahaya
                    if (brightness > 40) {
                        // Tambahkan sedikit noise posisi agar terlihat 3D/acak
                        const noiseX = (Math.random() - 0.5) * 2;
                        const noiseY = (Math.random() - 0.5) * 2;
                        
                        const drawX = (x * scaleX) + noiseX;
                        const drawY = (y * scaleY) + noiseY;

                        // Gradasi warna ala Spirit Net (Hijau ke Biru tergantung kontras)
                        if (brightness > 120) {
                            ctx.fillStyle = `rgba(0, 255, 136, ${Math.random() * 0.8 + 0.2})`; // Neon Green
                        } else if (brightness > 80) {
                            ctx.fillStyle = `rgba(0, 210, 255, ${Math.random() * 0.7 + 0.1})`; // Neon Blue
                        } else {
                            ctx.fillStyle = `rgba(100, 150, 255, ${Math.random() * 0.5})`; // Faded Blue/Purple
                        }

                        // Ukuran titik acak
                        const dotSize = Math.random() > 0.9 ? 2 : 1;
                        
                        ctx.fillRect(drawX, drawY, dotSize, dotSize);
                        dotsRendered++;
                    }
                }
            }

            // Update UI Counter agar terlihat seperti sistem LiDAR sungguhan
            // Mengombinasikan angka acak statis besar dengan jumlah titik aktual yang dirender
            basePoints += (Math.random() - 0.5) * 1000;
            const finalCount = Math.floor(basePoints + (dotsRendered * 15));
            counter.innerText = finalCount.toLocaleString('en-US');

            animationId = requestAnimationFrame(processLiDAREffect);
        }

        // Efek Tombol Record
        document.getElementById('rec-btn').addEventListener('click', function() {
            this.classList.toggle('recording');
        });
    </script>
</body>
</html>
