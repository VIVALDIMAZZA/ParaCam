<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Vision SLS - AR</title>
    
    <!-- Babylon.js Core via CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    
    <style>
        :root {
            --sls-green: #00ff00;
            --sls-dark: #001100;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: var(--sls-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; user-select: none;
        }
        /* Canvas untuk 3D (Layer Bawah) */
        #renderCanvas {
            width: 100%; height: 100%; touch-action: none; position: absolute; top: 0; left: 0; z-index: 1;
        }
        /* HUD UI (Layer Atas) mirip referensi gambar */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }
        .hud-header {
            background: rgba(0, 0, 0, 0.7); padding: 10px; font-size: 10px; border-bottom: 1px solid var(--sls-green);
            text-align: center;
        }
        .hud-stats {
            display: flex; justify-content: space-around; margin-top: 5px; opacity: 0.8;
        }
        .center-text {
            position: absolute; top: 20%; width: 100%; text-align: center; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 5px var(--sls-green); animation: blink 2s infinite;
        }
        .hud-footer {
            background: rgba(0, 0, 0, 0.8); padding: 15px; border-top: 1px solid var(--sls-green);
            display: flex; justify-content: space-around; align-items: center; pointer-events: auto;
        }
        .btn-action {
            background: transparent; border: 2px solid var(--sls-green); color: var(--sls-green);
            padding: 10px 20px; font-family: inherit; font-weight: bold; border-radius: 5px; cursor: pointer;
        }
        .btn-action:active { background: var(--sls-green); color: #000; }
        
        #minimap {
            position: absolute; bottom: 80px; right: 10px; width: 100px; height: 100px;
            border: 1px solid var(--sls-green); background: rgba(0,20,0,0.5); border-radius: 50%;
        }

        /* Layar Izin / Startup */
        #startup-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box;
        }
        #log-box { width: 90%; height: 150px; overflow-y: auto; text-align: left; font-size: 12px; margin-bottom: 20px; border: 1px dashed var(--sls-green); padding: 10px; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <!-- Layar Inisialisasi & Izin -->
    <div id="startup-screen">
        <h2>[ GHOST VISION SLS SYSTEM ]</h2>
        <div id="log-box">Menunggu inisialisasi...</div>
        <button class="btn-action" id="start-btn" onclick="initializeSystem()">REQUEST PERMISSIONS & START</button>
        <p style="font-size: 10px; margin-top: 20px; color: #888;">Catatan: Aplikasi membutuhkan HTTPS untuk Kamera & AR.</p>
    </div>

    <!-- UI Kamera SLS -->
    <div id="ui-layer" style="display: none;">
        <div class="hud-header">
            <div>[ GHOST VISION SLS ]</div>
            <div class="hud-stats">
                <span>ILLc <span id="s-illc">0179</span></span>
                <span>EXPc <span id="s-expc">0.017</span></span>
                <span>ISOc <span id="s-isoc">5514</span></span>
                <span>GPS: <span id="s-gps">WAIT</span></span>
            </div>
        </div>
        <div class="center-text" id="alert-text" style="display:none;">What is that ???</div>
        <canvas id="minimap"></canvas>
        <div class="hud-footer">
            <div style="font-size: 10px; text-align: center;">MATRIX<br><br><span style="color:white">ON</span></div>
            <button class="btn-action" id="ar-btn">ENTER AR MODE</button>
            <div style="font-size: 10px; text-align: center;">RECORD<br><br><div style="width:20px; height:20px; background: red; border-radius:50%; margin: 0 auto;"></div></div>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const logBox = document.getElementById("log-box");
        let engine, scene, xrExperience, ghostMesh, minimapCtx;
        let ghostActive = false;

        function log(msg) {
            logBox.innerHTML += `<div>> ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- SISTEM PERIZINAN (Kamera, GPS, Storage) ---
        async function requestPermissions() {
            log("Memeriksa Storage (IndexedDB/Local)...");
            if (navigator.storage && navigator.storage.persist) {
                const isPersisted = await navigator.storage.persist();
                log(`Persistent Storage: ${isPersisted ? "Diizinkan" : "Sesi Sementara"}`);
            }

            log("Meminta akses GPS...");
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    log("GPS OK.");
                    document.getElementById("s-gps").innerText = `${pos.coords.latitude.toFixed(2)},${pos.coords.longitude.toFixed(2)}`;
                },
                (err) => { log(`GPS Gagal: ${err.message}. Menggunakan simulasi lokal.`); },
                { enableHighAccuracy: true }
            );

            log("Meminta akses Kamera Utama...");
            try {
                // Hanya mengecek izin, rendering akan diambil alih oleh WebXR
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                stream.getTracks().forEach(track => track.stop()); // Matikan stream setelah dapat izin
                log("Kamera OK.");
                return true;
            } catch (err) {
                log(`Kamera Gagal (Wajib HTTPS/Localhost): ${err.message}`);
                return false;
            }
        }

        // --- INISIALISASI UTAMA (HTML/UI) ---
        async function initializeSystem() {
            document.getElementById("start-btn").disabled = true;
            const perms = await requestPermissions();
            
            if(!perms && window.location.protocol === 'file:') {
                alert("Keamanan Browser: Kamera dan AR tidak bisa diakses jika dibuka dari file lokal (file:///). Harap gunakan Local Server (Live Server) atau HTTPS.");
                // Tetap lanjut untuk menunjukkan interface
            }

            setTimeout(initBabylon, 1000);
        }

        // --- CORE 3D & AR (Babylon.js) ---
        async function initBabylon() {
            log("Memulai Mesin 3D...");
            engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); // Transparan untuk AR

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            // Kamera Fallback jika tidak masuk AR
            const camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 1.5, -3), scene);
            camera.setTarget(BABYLON.Vector3.Zero());

            createProceduralGhost();
            setupMinimap();

            document.getElementById("startup-screen").style.display = "none";
            document.getElementById("ui-layer").style.display = "flex";

            // Loop Render & Efek HUD
            engine.runRenderLoop(() => {
                scene.render();
                updateHUD();
                updateMinimap();
            });
            window.addEventListener("resize", () => { engine.resize(); });

            setupWebXR();
        }

        // --- MEMBUAT HANTU PROSEDURAL (Wireframe Hijau seperti referensi gambar) ---
        function createProceduralGhost() {
            // Kita merakit humanoid tanpa load file eksternal agar aman dari CORS error saat produksi
            const body = BABYLON.MeshBuilder.CreateCapsule("body", {height: 1.5, radius: 0.3}, scene);
            const head = BABYLON.MeshBuilder.CreateSphere("head", {diameter: 0.4}, scene);
            head.position.y = 1.0;
            const arm = BABYLON.MeshBuilder.CreateCylinder("arm", {height: 0.8, diameter: 0.1}, scene);
            arm.position.x = 0.4; arm.position.y = 0.4; arm.rotation.z = Math.PI / 4;
            
            ghostMesh = BABYLON.Mesh.MergeMeshes([body, head, arm], true, true, undefined, false, true);
            
            // Material SLS Kawat Hijau
            const slsMaterial = new BABYLON.StandardMaterial("slsMat", scene);
            slsMaterial.emissiveColor = new BABYLON.Color3(0.1, 1, 0.1);
            slsMaterial.wireframe = true;
            slsMaterial.alpha = 0.8;
            slsMaterial.disableLighting = true; // Menyala dalam gelap
            
            ghostMesh.material = slsMaterial;
            ghostMesh.isVisible = false;
        }

        // --- SISTEM AR & SMART SPAWNING ---
        async function setupWebXR() {
            try {
                xrExperience = await scene.createDefaultXRExperienceAsync({
                    uiOptions: { sessionMode: 'immersive-ar', referenceSpaceType: 'local-floor' }
                });

                // Membajak tombol AR kustom kita ke fungsi bawaan Babylon
                document.getElementById("ar-btn").addEventListener("click", async () => {
                    await xrExperience.baseExperience.enterXRAsync('immersive-ar', 'local-floor');
                });

                // Fitur Deteksi Lantai (Plane Detection) & Hit Test
                const fm = xrExperience.baseExperience.featuresManager;
                
                // Smart Spawning: Mencari permukaan lantai
                const hitTest = fm.enableFeature(BABYLON.WebXRHitTest, 'latest');
                
                let lastHitTest = null;
                hitTest.onHitTestResultObservable.add((results) => {
                    if (results.length > 0) {
                        lastHitTest = results[0]; // Simpan titik lantai yang valid
                    }
                });

                // Algoritma Memunculkan Hantu secara periodik
                setInterval(() => {
                    if (xrExperience.baseExperience.state === BABYLON.WebXRState.IN_XR) {
                        spawnSmartGhost(lastHitTest);
                    }
                }, 8000); // Tiap 8 detik evaluasi

            } catch (e) {
                console.warn("WebXR tidak didukung. Jalankan di Android Chrome via HTTPS.");
            }
        }

        function spawnSmartGhost(hitTestResult) {
            if (!ghostMesh) return;
            
            if (hitTestResult && !ghostActive) {
                // Spawning Pintar: Tempatkan persis di lantai fisik yang terdeteksi
                hitTestResult.transformationMatrix.decompose(undefined, undefined, ghostMesh.position);
                ghostMesh.position.y += 0.8; // Angkat sedikit dari lantai
                
                ghostMesh.isVisible = true;
                ghostActive = true;
                document.getElementById("alert-text").style.display = "block"; // Munculkan teks "What is that ???"

                // Hadapkan ke pemain (kamera)
                ghostMesh.lookAt(xrExperience.baseExperience.camera.position);

                // Hilangkan setelah beberapa detik (efek roh)
                setTimeout(() => {
                    ghostMesh.isVisible = false;
                    ghostActive = false;
                    document.getElementById("alert-text").style.display = "none";
                }, 4000);
            }
        }

        // --- MINIMAP LOKAL & HUD ---
        function setupMinimap() {
            const mmCanvas = document.getElementById("minimap");
            mmCanvas.width = 100; mmCanvas.height = 100;
            minimapCtx = mmCanvas.getContext("2d");
        }

        function updateMinimap() {
            if (!minimapCtx) return;
            minimapCtx.clearRect(0, 0, 100, 100);
            
            // Gambar posisi kamera (Tengah)
            minimapCtx.fillStyle = "#fff";
            minimapCtx.beginPath();
            minimapCtx.arc(50, 50, 3, 0, Math.PI * 2);
            minimapCtx.fill();

            // Jika hantu aktif, gambar di minimap relatif terhadap kamera
            if (ghostActive && ghostMesh && xrExperience && xrExperience.baseExperience.camera) {
                const camPos = xrExperience.baseExperience.camera.position;
                const relX = (ghostMesh.position.x - camPos.x) * 10; // Skala jarak
                const relZ = (ghostMesh.position.z - camPos.z) * 10;
                
                minimapCtx.fillStyle = "#0f0";
                minimapCtx.beginPath();
                minimapCtx.arc(50 + relX, 50 - relZ, 4, 0, Math.PI * 2);
                minimapCtx.fill();
            }
        }

        function updateHUD() {
            // Simulasi angka yang berubah-ubah di atas layar (efek ala alat paranormal)
            if (Math.random() > 0.8) {
                document.getElementById("s-illc").innerText = Math.floor(Math.random() * 300).toString().padStart(4, '0');
                document.getElementById("s-expc").innerText = (Math.random() * 0.1).toFixed(3);
            }
        }
    </script>
</body>
</html>
