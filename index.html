<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anomaly Scanner - True AR</title>
    
    <!-- Babylon.js Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://code.jquery.com/pep/0.4.3/pep.js"></script>
    
    <style>
        :root {
            --ui-color: #00d2ff;
            --warn-color: #ff3366;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: var(--ui-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; touch-action: none;
        }

        #renderCanvas {
            width: 100%; height: 100%; touch-action: none; 
            position: absolute; top: 0; left: 0; z-index: 1; outline: none;
        }

        /* HUD Overlay yang tetap muncul di AR (DOM Overlay) */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; box-sizing: border-box;
        }

        .hud-header {
            border-left: 3px solid var(--ui-color); padding-left: 10px;
            background: linear-gradient(90deg, rgba(0,210,255,0.2) 0%, transparent 100%);
        }
        .title { font-weight: bold; font-size: 16px; letter-spacing: 2px; }
        .status { font-size: 12px; margin-top: 5px; color: #fff; }
        
        .scan-warning {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--warn-color); font-weight: bold; font-size: 18px; text-align: center;
            text-shadow: 0 0 10px var(--warn-color); display: none;
            animation: pulse 1s infinite;
        }

        .hud-footer { text-align: center; pointer-events: auto; }
        
        .btn-ar {
            background: rgba(0, 20, 40, 0.8); border: 1px solid var(--ui-color); color: var(--ui-color);
            padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); text-transform: uppercase;
        }
        .btn-ar:active { background: var(--ui-color); color: #000; }

        /* Layar Startup */
        #startup {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #050505; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="startup">
        <h2 style="color: var(--ui-color);">[ SPATIAL ANOMALY DETECTOR ]</h2>
        <p style="font-size: 12px; color: #888; max-width: 300px;">Aplikasi ini membutuhkan akses Kamera dan Sensor Ruang (WebXR Hit-Test). Gerakkan HP untuk memindai lantai/ruangan setelah AR aktif.</p>
        <button class="btn-ar" onclick="initEngine()" style="margin-top: 20px;">INITIATE SENSORS</button>
    </div>

    <!-- UI LAYER (Akan di-inject ke dalam WebXR DOM Overlay) -->
    <div id="hud-layer" style="display: none;">
        <div class="hud-header">
            <div class="title">SPATIAL SCANNER</div>
            <div class="status" id="sys-status">Menunggu AR...</div>
        </div>
        
        <div class="scan-warning" id="warning-text">UNKNOWN ANOMALY DETECTED</div>
        
        <div class="hud-footer">
            <button class="btn-ar" id="btn-enter-ar" style="display:none;">ENTER AR MODE</button>
        </div>
    </div>

    <canvas id="renderCanvas" touch-action="none"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        let engine, scene, xrExperience, anomalyEntity, marker;
        let anomalyActive = false;

        async function initEngine() {
            document.getElementById("startup").style.display = "none";
            document.getElementById("hud-layer").style.display = "flex";
            
            engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true, alpha: true });
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); // Transparan untuk AR

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 1.2;

            // Kamera standar sebelum masuk AR
            const camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 1.5, -3), scene);
            camera.setTarget(BABYLON.Vector3.Zero());

            createScannerMarker(); // Membuat target pemindai lantai
            createWeirdAnomaly();  // Membuat entitas aneh

            engine.runRenderLoop(() => { scene.render(); });
            window.addEventListener("resize", () => { engine.resize(); });

            setupAR();
        }

        // 1. MEMBUAT MARKER PEMINDAI RUANGAN
        function createScannerMarker() {
            // Ini adalah lingkaran biru yang akan menempel pada lantai/dinding fisik
            marker = BABYLON.MeshBuilder.CreateTorus("marker", { diameter: 0.5, thickness: 0.02 }, scene);
            marker.rotation.x = Math.PI / 2; // Rebahkan di lantai
            
            const markerMat = new BABYLON.StandardMaterial("markerMat", scene);
            markerMat.emissiveColor = new BABYLON.Color3(0, 0.8, 1);
            markerMat.alpha = 0.6;
            markerMat.disableLighting = true;
            marker.material = markerMat;
            
            marker.isVisible = false; // Sembunyikan sampai lantai terdeteksi
        }

        // 2. MEMBUAT ENTITAS ANEH (Non-Humanoid, Abstrak)
        function createWeirdAnomaly() {
            // Kita bungkus dalam satu TransformNode agar mudah dipindah-pindah
            anomalyEntity = new BABYLON.TransformNode("anomalyRoot");

            // Inti Entitas: Bola energi berwarna merah/ungu gelap
            const core = BABYLON.MeshBuilder.CreateIcoSphere("core", { radius: 0.2, subdivisions: 3 }, scene);
            const coreMat = new BABYLON.StandardMaterial("coreMat", scene);
            coreMat.emissiveColor = new BABYLON.Color3(1, 0, 0.5);
            coreMat.wireframe = true;
            core.material = coreMat;
            core.parent = anomalyEntity;

            // Material untuk cincin luar
            const ringMat = new BABYLON.StandardMaterial("ringMat", scene);
            ringMat.emissiveColor = new BABYLON.Color3(0.5, 0, 1);
            ringMat.alpha = 0.8;
            ringMat.wireframe = true;

            // Cincin-cincin dimensi yang melayang (Torus berpotongan)
            const ring1 = BABYLON.MeshBuilder.CreateTorus("r1", { diameter: 0.6, thickness: 0.03 }, scene);
            const ring2 = BABYLON.MeshBuilder.CreateTorus("r2", { diameter: 0.8, thickness: 0.01 }, scene);
            const ring3 = BABYLON.MeshBuilder.CreateTorus("r3", { diameter: 1.0, thickness: 0.05 }, scene);
            
            ring1.material = ringMat; ring2.material = ringMat; ring3.material = ringMat;
            ring1.parent = anomalyEntity; ring2.parent = anomalyEntity; ring3.parent = anomalyEntity;

            anomalyEntity.position.y = -100; // Sembunyikan jauh di bawah tanah sementara
            
            // Animasi: Membuat cincin berputar dengan sumbu dan kecepatan aneh setiap frame rendering
            scene.onBeforeRenderObservable.add(() => {
                if(anomalyActive) {
                    core.rotation.y += 0.05;
                    ring1.rotation.x += 0.02; ring1.rotation.y += 0.03;
                    ring2.rotation.y -= 0.04; ring2.rotation.z += 0.01;
                    ring3.rotation.x -= 0.01; ring3.rotation.z -= 0.03;
                    
                    // Efek denyut ukuran pada inti
                    let scale = 1 + Math.sin(Date.now() * 0.005) * 0.2;
                    core.scaling = new BABYLON.Vector3(scale, scale, scale);
                }
            });
        }

        // 3. SISTEM AR (Pemetaan Ruang)
        async function setupAR() {
            try {
                // Konfigurasi WebXR Khusus untuk Mendeteksi Ruang (Hit-Test)
                xrExperience = await scene.createDefaultXRExperienceAsync({
                    uiOptions: { sessionMode: 'immersive-ar', referenceSpaceType: 'local-floor' },
                    optionalFeatures: true
                });

                const fm = xrExperience.baseExperience.featuresManager;
                
                // Aktifkan Hit Test (Memancarkan sinar virtual dari kamera ke dunia nyata)
                const hitTest = fm.enableFeature(BABYLON.WebXRHitTest, 'latest');
                
                // Aktifkan UI Overlay agar HTML HUD kita tidak tertutup oleh AR mode
                try {
                    fm.enableFeature(BABYLON.WebXRFeatureName.DOM_OVERLAY, "latest", { element: "#hud-layer" });
                } catch(e) {}

                document.getElementById("btn-enter-ar").style.display = "inline-block";
                document.getElementById("btn-enter-ar").onclick = async () => {
                    await xrExperience.baseExperience.enterXRAsync('immersive-ar', 'local-floor');
                };

                // Deteksi Perubahan Status AR
                xrExperience.baseExperience.onStateChangedObservable.add((state) => {
                    if (state === BABYLON.WebXRState.IN_XR) {
                        document.getElementById("btn-enter-ar").style.display = "none";
                        document.getElementById("sys-status").innerText = "STATUS: MENGANALISIS RUANGAN. Gerakkan kamera.";
                    }
                });

                let lastHitPosition = null;

                // Logika Pemetaan: Saat sensor HP menemukan permukaan (lantai/meja)
                hitTest.onHitTestResultObservable.add((results) => {
                    if (results.length > 0) {
                        marker.isVisible = true;
                        // Tempelkan Marker (lingkaran biru) ke permukaan fisik
                        results[0].transformationMatrix.decompose(undefined, marker.rotationQuaternion, marker.position);
                        lastHitPosition = marker.position.clone();
                        document.getElementById("sys-status").innerText = "STATUS: PERMUKAAN TERDETEKSI";
                    } else {
                        marker.isVisible = false;
                        document.getElementById("sys-status").innerText = "STATUS: MENCARI PERMUKAAN...";
                    }
                });

                // Sistem Kemunculan Acak Entitas Aneh (Manifestation Logic)
                setInterval(() => {
                    const inXR = xrExperience.baseExperience.state === BABYLON.WebXRState.IN_XR;
                    
                    // Jika sedang di AR, marker menemukan lantai, dan tidak ada entitas aktif (30% peluang muncul)
                    if (inXR && marker.isVisible && lastHitPosition && !anomalyActive && Math.random() > 0.7) {
                        spawnAnomaly(lastHitPosition);
                    }
                }, 4000);

            } catch (e) {
                alert("Perangkat atau Browser ini tidak mendukung WebXR ARCore. Pastikan menggunakan Chrome Android dan link HTTPS (GitHub Pages).");
            }
        }

        function spawnAnomaly(position) {
            anomalyActive = true;
            
            // Pindahkan entitas ke lokasi fisik (lantai/meja) yang terdeteksi
            anomalyEntity.position = new BABYLON.Vector3(position.x, position.y + 0.5, position.z); // Muncul 0.5 meter di atas lantai
            
            document.getElementById("warning-text").style.display = "block";

            // Hilangkan secara gaib setelah beberapa detik
            setTimeout(() => {
                anomalyEntity.position.y = -100; // Sembunyikan lagi
                anomalyActive = false;
                document.getElementById("warning-text").style.display = "none";
            }, 6000);
        }
    </script>
</body>
</html>
